<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Golos Text', Arial, sans-serif; }
      .caps { font-family: 'Golos Text', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 3.5px; fill: #8A7F82; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B3A2E" flood-opacity="0.13"/>
    </filter>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EADCD3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EADCD3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="#F3EEE7"/>

  <!-- 16:9: содержимое сдвинуто на 40px, чтобы кадр MAX не срезал края -->
  <g transform="translate(0 40)">
  <circle cx="1010" cy="330" r="330" fill="url(#glow)"/>

  <!-- Текст -->
  <rect x="88" y="138" width="30" height="3" rx="1.5" fill="#893939"/>
  <text x="132" y="146" class="caps">СЛУЖЕБНЫЕ ДОКУМЕНТЫ</text>

  <text x="84" y="252" class="serif" font-size="84" fill="#2A2326" letter-spacing="-1.5">Из черновика</text>
  <text x="84" y="344" class="serif" font-size="84" fill="#2A2326" letter-spacing="-1.5">— в <tspan font-style="italic" fill="#893939">документ</tspan></text>

  <text x="88" y="412" class="sans" font-size="22" fill="#6F6568">Исправлю ошибки и стиль, разберу реквизиты</text>
  <text x="88" y="444" class="sans" font-size="22" fill="#6F6568">и пришлю готовый файл Word.</text>

  <!-- Три шага -->
  <g class="sans" font-size="18">
    <circle cx="105" cy="532" r="18" fill="#893939"/>
    <text x="105" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFDF9">1</text>
    <text x="133" y="538" fill="#2A2326" font-weight="500">Черновик</text>
    <path d="M232 532 h26 m-8 -6 l8 6 l-8 6" stroke="#B8A9A3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="290" cy="532" r="18" fill="#893939"/>
    <text x="290" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFDF9">2</text>
    <text x="318" y="538" fill="#2A2326" font-weight="500">Тип и шаблон</text>
    <path d="M452 532 h26 m-8 -6 l8 6 l-8 6" stroke="#B8A9A3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="510" cy="532" r="18" fill="#893939"/>
    <text x="510" y="538" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFDF9">3</text>
    <text x="538" y="538" fill="#2A2326" font-weight="500">Файл Word</text>
  </g>

  <!-- Черновик: неровные строки, зачёркивания -->
  <g transform="rotate(-8 860 330)">
    <rect x="735" y="160" width="250" height="330" rx="6" fill="#FBF6EE" stroke="#E2D7CB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="760" y="200" class="serif" font-size="20" font-style="italic" fill="#9A8E88">черновик</text>
    <g stroke="#B7AAA1" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M760 236 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 266 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 296 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 326 q 11 -6 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 368 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 398 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M760 428 q 11 -6 22 0 t 22 0 t 22 0"/>
    </g>
    <path d="M840 262 l 70 8" stroke="#893939" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M790 322 l 60 6" stroke="#893939" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <circle cx="905" cy="398" r="17" stroke="#893939" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Готовый документ -->
  <g filter="url(#shadow)">
    <rect x="900" y="104" width="300" height="420" rx="4" fill="#FFFDF9"/>
  </g>
  <g class="sans">
    <text x="1172" y="146" text-anchor="end" font-size="12" fill="#8A7F82">Генеральному директору</text>
    <text x="1172" y="163" text-anchor="end" font-size="12" fill="#8A7F82">Иванову И. И.</text>
  </g>
  <text x="1050" y="214" text-anchor="middle" class="serif" font-size="21" fill="#2A2326">Служебная записка</text>
  <g fill="#E7DFD7">
    <rect x="928" y="244" width="244" height="7" rx="3.5"/>
    <rect x="928" y="262" width="244" height="7" rx="3.5"/>
    <rect x="928" y="280" width="228" height="7" rx="3.5"/>
    <rect x="928" y="298" width="170" height="7" rx="3.5"/>
    <rect x="928" y="328" width="244" height="7" rx="3.5"/>
    <rect x="928" y="346" width="238" height="7" rx="3.5"/>
    <rect x="928" y="364" width="140" height="7" rx="3.5"/>
    <rect x="1008" y="401" width="118" height="7" rx="3.5"/>
  </g>
  <rect x="928" y="393" width="68" height="22" rx="3" fill="#F4E3A8"/>
  <text x="962" y="409" text-anchor="middle" class="sans" font-size="12" font-weight="500" fill="#8C5A11">[Номер]</text>
  <line x1="928" y1="450" x2="1172" y2="450" stroke="#EAE2DA" stroke-width="1.5"/>
  <text x="928" y="484" class="sans" font-size="13" fill="#2A2326">Петров П. П.</text>
  <path d="M1098 486 c 10 -22 18 -24 16 -6 c -2 14 10 -10 18 -12 c 6 -1 2 12 10 8 c 6 -3 10 -6 14 -6" stroke="#893939" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Искры -->
  <g fill="#893939">
    <path d="M884 92 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity="0.85"/>
    <path d="M1226 470 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity="0.6"/>
  </g>
  <path d="M1222 132 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#C59A3E" opacity="0.8"/>
  </g>
</svg>
