<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Golos Text', Arial, sans-serif; }
      .caps { font-family: 'Golos Text', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 3.5px; fill: #8A7F82; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B3A2E" flood-opacity="0.13"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5B3A2E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F3EEE7"/>

  <!-- 16:9: содержимое сдвинуто на 40px, чтобы кадр MAX не срезал края -->
  <g transform="translate(0 40)">

  <!-- Текст -->
  <rect x="88" y="150" width="30" height="3" rx="1.5" fill="#893939"/>
  <text x="132" y="158" class="caps">ОБРАБОТКА НА ПАУЗЕ</text>
  <text x="84" y="258" class="serif" font-size="76" fill="#2A2326" letter-spacing="-1.5">Сервис ИИ</text>
  <text x="84" y="342" class="serif" font-size="76" font-style="italic" fill="#893939" letter-spacing="-1.5">недоступен</text>
  <text x="88" y="404" class="sans" font-size="22" fill="#6F6568">Черновик сохранён — ничего вводить</text>
  <text x="88" y="436" class="sans" font-size="22" fill="#6F6568">заново не нужно.</text>

  <g transform="translate(88 490)">
    <circle cx="20" cy="20" r="20" fill="#F1E4E1"/>
    <path d="M28 14 a 10 10 0 1 0 2.2 9.5" stroke="#893939" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M30.5 7.5 v 7.5 h -7.5" stroke="#893939" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="27" class="sans" font-size="19" fill="#2A2326">Нажмите «Повторить», когда будете готовы</text>
  </g>

  <!-- Сохранённый черновик -->
  <g transform="rotate(-3 960 330)">
    <g filter="url(#shadow)">
      <rect x="800" y="100" width="330" height="440" rx="4" fill="#FFFDF9"/>
    </g>
    <!-- Закладка -->
    <path d="M1066 100 h 38 v 74 l -19 -14 l -19 14 z" fill="#893939"/>

    <rect x="828" y="130" width="150" height="30" rx="15" fill="#E6EEE2"/>
    <path d="M845 145 l 6 6 l 11 -12" stroke="#3F6B3A" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="870" y="150" class="sans" font-size="13" font-weight="600" fill="#3F6B3A">Сохранено</text>

    <text x="830" y="206" class="serif" font-size="20" font-style="italic" fill="#9A8E88">черновик</text>
    <g stroke="#C3B7AE" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M830 244 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 274 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 304 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 334 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 376 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 406 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
      <path d="M830 436 q 11 -6 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0 t 22 0"/>
    </g>
  </g>

  <!-- Пауза -->
  <g filter="url(#soft)">
    <circle cx="1118" cy="500" r="58" fill="#FFFDF9"/>
  </g>
  <circle cx="1118" cy="500" r="47" fill="none" stroke="#F1E4E1" stroke-width="6"/>
  <rect x="1100" y="478" width="12" height="44" rx="4" fill="#893939"/>
  <rect x="1124" y="478" width="12" height="44" rx="4" fill="#893939"/>
  </g>
</svg>
