<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Golos Text', Arial, sans-serif; }
      .caps { font-family: 'Golos Text', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 3.5px; fill: #8A7F82; }
      .name { font-family: 'Golos Text', Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #2A2326; }
      .hint { font-family: 'Golos Text', Arial, sans-serif; font-size: 15px; fill: #7A7073; }
      .dtitle { font-family: Georgia, 'Times New Roman', serif; font-size: 11px; letter-spacing: 1.6px; fill: #2A2326; }
      .tiny { font-family: 'Golos Text', Arial, sans-serif; font-size: 9px; fill: #8A7F82; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#5B3A2E" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F3EEE7"/>

  <!-- 16:9: содержимое сдвинуто на 40px, чтобы кадр MAX не срезал края -->
  <g transform="translate(0 40)">

  <rect x="72" y="80" width="30" height="3" rx="1.5" fill="#893939"/>
  <text x="116" y="88" class="caps">ШАГ 2 ИЗ 3</text>
  <text x="68" y="158" class="serif" font-size="56" fill="#2A2326" letter-spacing="-1">Какой документ <tspan font-style="italic" fill="#893939">нужен?</tspan></text>

  <!-- Карточки -->
  <g filter="url(#shadow)" fill="#FFFDF9">
    <rect x="70" y="204" width="270" height="396" rx="10"/>
    <rect x="360" y="204" width="270" height="396" rx="10"/>
    <rect x="650" y="204" width="270" height="396" rx="10"/>
    <rect x="940" y="204" width="270" height="396" rx="10"/>
  </g>

  <!-- Мини-листы -->
  <g fill="#FAF6F0" stroke="#EAE1D8" stroke-width="1.2">
    <rect x="100" y="232" width="210" height="234" rx="3"/>
    <rect x="390" y="232" width="210" height="234" rx="3"/>
    <rect x="680" y="232" width="210" height="234" rx="3"/>
    <rect x="970" y="232" width="210" height="234" rx="3"/>
  </g>

  <!-- 1. Служебная записка: адресат справа, заголовок, абзацы, подпись -->
  <g fill="#E3D9CF">
    <rect x="222" y="252" width="70" height="6" rx="3"/>
    <rect x="240" y="264" width="52" height="6" rx="3"/>
    <rect x="118" y="320" width="174" height="6" rx="3"/>
    <rect x="118" y="334" width="174" height="6" rx="3"/>
    <rect x="118" y="348" width="140" height="6" rx="3"/>
    <rect x="118" y="370" width="174" height="6" rx="3"/>
    <rect x="118" y="384" width="120" height="6" rx="3"/>
    <rect x="118" y="436" width="64" height="6" rx="3"/>
    <rect x="238" y="436" width="54" height="6" rx="3"/>
  </g>
  <text x="205" y="302" text-anchor="middle" class="dtitle">СЛУЖЕБНАЯ ЗАПИСКА</text>

  <!-- 2. Докладная записка: заголовок, список пунктов -->
  <g fill="#E3D9CF">
    <rect x="512" y="252" width="70" height="6" rx="3"/>
    <rect x="530" y="264" width="52" height="6" rx="3"/>
    <rect x="408" y="320" width="174" height="6" rx="3"/>
    <rect x="422" y="346" width="160" height="6" rx="3"/>
    <rect x="422" y="368" width="140" height="6" rx="3"/>
    <rect x="422" y="390" width="152" height="6" rx="3"/>
    <rect x="408" y="436" width="64" height="6" rx="3"/>
    <rect x="528" y="436" width="54" height="6" rx="3"/>
  </g>
  <g fill="#893939">
    <circle cx="411" cy="349" r="3"/>
    <circle cx="411" cy="371" r="3"/>
    <circle cx="411" cy="393" r="3"/>
  </g>
  <text x="495" y="302" text-anchor="middle" class="dtitle">ДОКЛАДНАЯ ЗАПИСКА</text>

  <!-- 3. Справка: заголовок, таблица фактов -->
  <text x="785" y="276" text-anchor="middle" class="dtitle" letter-spacing="3">СПРАВКА</text>
  <g fill="#E3D9CF">
    <rect x="698" y="296" width="174" height="6" rx="3"/>
    <rect x="698" y="310" width="130" height="6" rx="3"/>
  </g>
  <g stroke="#D9CCBF" stroke-width="1.2" fill="none">
    <rect x="698" y="332" width="174" height="96" rx="2"/>
    <line x1="698" y1="356" x2="872" y2="356"/>
    <line x1="698" y1="380" x2="872" y2="380"/>
    <line x1="698" y1="404" x2="872" y2="404"/>
    <line x1="760" y1="332" x2="760" y2="428"/>
  </g>
  <rect x="699" y="333" width="172" height="23" fill="#F1E4E1"/>
  <g fill="#E3D9CF">
    <rect x="708" y="365" width="40" height="6" rx="3"/>
    <rect x="770" y="365" width="84" height="6" rx="3"/>
    <rect x="708" y="389" width="34" height="6" rx="3"/>
    <rect x="770" y="389" width="92" height="6" rx="3"/>
    <rect x="708" y="413" width="44" height="6" rx="3"/>
    <rect x="770" y="413" width="60" height="6" rx="3"/>
    <rect x="698" y="444" width="120" height="6" rx="3"/>
  </g>
  <g fill="#893939" opacity="0.55">
    <rect x="708" y="341" width="36" height="6" rx="3"/>
    <rect x="770" y="341" width="64" height="6" rx="3"/>
  </g>

  <!-- 4. Письмо: бланк организации, обращение, подпись -->
  <rect x="970" y="232" width="210" height="5" fill="#893939"/>
  <g fill="#2A2326" opacity="0.8">
    <rect x="988" y="254" width="72" height="7" rx="3.5"/>
  </g>
  <g fill="#E3D9CF">
    <rect x="988" y="267" width="54" height="5" rx="2.5"/>
    <rect x="1094" y="290" width="68" height="6" rx="3"/>
    <rect x="1106" y="302" width="56" height="6" rx="3"/>
    <rect x="1098" y="314" width="64" height="6" rx="3"/>
    <rect x="988" y="364" width="174" height="6" rx="3"/>
    <rect x="988" y="378" width="174" height="6" rx="3"/>
    <rect x="988" y="392" width="150" height="6" rx="3"/>
    <rect x="988" y="406" width="100" height="6" rx="3"/>
    <rect x="988" y="436" width="70" height="6" rx="3"/>
  </g>
  <line x1="988" y1="278" x2="1162" y2="278" stroke="#EAE1D8" stroke-width="1"/>
  <text x="1075" y="348" text-anchor="middle" class="serif" font-size="11" font-style="italic" fill="#2A2326">Уважаемый Иван Иванович!</text>
  <path d="M1108 440 c 8 -16 14 -18 12 -4 c -1 10 8 -7 13 -9 c 5 -1 2 9 8 6 c 4 -2 8 -4 11 -4" stroke="#893939" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <!-- Подписи карточек -->
  <text x="100" y="512" class="name">Служебная записка</text>
  <text x="100" y="542" class="hint">Обращение между</text>
  <text x="100" y="564" class="hint">подразделениями</text>

  <text x="390" y="512" class="name">Докладная записка</text>
  <text x="390" y="542" class="hint">Доклад руководству</text>
  <text x="390" y="564" class="hint">о ситуации или проблеме</text>

  <text x="680" y="512" class="name">Справка</text>
  <text x="680" y="542" class="hint">Сведения и факты</text>
  <text x="680" y="564" class="hint">по запросу</text>

  <text x="970" y="512" class="name">Письмо</text>
  <text x="970" y="542" class="hint">Официальная переписка</text>
  <text x="970" y="564" class="hint">с организациями</text>
  </g>
</svg>
