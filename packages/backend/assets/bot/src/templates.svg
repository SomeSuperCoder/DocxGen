<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: 'Golos Text', Arial, sans-serif; }
      .caps { font-family: 'Golos Text', Arial, sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 3.5px; fill: #8A7F82; }
      .tag { font-family: 'Golos Text', Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; fill: #893939; }
      .tagnote { font-family: 'Golos Text', Arial, sans-serif; font-size: 13px; fill: #8A7F82; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B3A2E" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#F3EEE7"/>

  <!-- 16:9: содержимое сдвинуто на 40px, чтобы кадр MAX не срезал края -->
  <g transform="translate(0 40)">

  <!-- Текст слева -->
  <rect x="80" y="170" width="30" height="3" rx="1.5" fill="#893939"/>
  <text x="124" y="178" class="caps">ШАГ 2 ИЗ 3</text>
  <text x="76" y="256" class="serif" font-size="62" fill="#2A2326" letter-spacing="-1">Оформление</text>
  <text x="80" y="318" class="sans" font-size="21" fill="#6F6568">Шаблон меняет только</text>
  <text x="80" y="348" class="sans" font-size="21" fill="#6F6568">внешний вид — текст</text>
  <text x="80" y="378" class="sans" font-size="21" fill="#6F6568">остаётся тем же.</text>

  <g transform="translate(80 438)">
    <circle cx="16" cy="16" r="16" fill="#F1E4E1"/>
    <path d="M22.5 11.5 a 8 8 0 1 0 1.8 7.5" stroke="#893939" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M24.5 6.5 v 6 h -6" stroke="#893939" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="44" y="14" class="sans" font-size="16" fill="#2A2326">Сменить шаблон можно</text>
    <text x="44" y="35" class="sans" font-size="16" fill="#2A2326">и после получения файла</text>
  </g>

  <!-- Метки шаблонов -->
  <text x="500" y="58" class="tag">КЛАССИЧЕСКИЙ</text>
  <text x="500" y="78" class="tagnote">Times · адресат справа</text>
  <text x="880" y="58" class="tag">СОВРЕМЕННЫЙ</text>
  <text x="880" y="78" class="tagnote">Arial · организация в колонтитуле</text>

  <!-- Листы (обрезаны нижним краем) -->
  <g filter="url(#shadow)" fill="#FFFDF9">
    <rect x="500" y="100" width="340" height="580" rx="4"/>
    <rect x="880" y="100" width="340" height="580" rx="4"/>
  </g>

  <!-- Классический -->
  <g class="serif" fill="#2A2326">
    <text x="530" y="142" font-size="13" font-weight="700">ООО «Пример»</text>
    <text x="530" y="159" font-size="11" fill="#8A7F82">г. Москва, ул. Примерная, д. 1</text>
    <text x="810" y="196" font-size="12.5" text-anchor="end">Генеральному директору</text>
    <text x="810" y="213" font-size="12.5" text-anchor="end">Иванову И. И.</text>
    <text x="670" y="260" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.2">СЛУЖЕБНАЯ ЗАПИСКА</text>
    <text x="530" y="290" font-size="12">12.09.2026</text>
    <text x="758" y="290" font-size="12" text-anchor="end">№</text>
    <text x="670" y="324" font-size="13" font-weight="700" text-anchor="middle">О закупке ноутбука</text>
    <text x="530" y="560" font-size="12.5">Ведущий специалист</text>
    <text x="810" y="560" font-size="12.5" text-anchor="end">Петров П. П.</text>
  </g>
  <rect x="764" y="277" width="48" height="18" rx="2" fill="#F4E3A8"/>
  <text x="788" y="290" text-anchor="middle" class="serif" font-size="11" fill="#8C5A11">[Номер]</text>
  <g fill="#E7DFD7">
    <rect x="556" y="350" width="254" height="6" rx="3"/>
    <rect x="530" y="368" width="280" height="6" rx="3"/>
    <rect x="530" y="386" width="280" height="6" rx="3"/>
    <rect x="530" y="404" width="280" height="6" rx="3"/>
    <rect x="530" y="422" width="150" height="6" rx="3"/>
    <rect x="556" y="448" width="254" height="6" rx="3"/>
    <rect x="530" y="466" width="280" height="6" rx="3"/>
    <rect x="530" y="484" width="280" height="6" rx="3"/>
    <rect x="530" y="502" width="96" height="6" rx="3"/>
  </g>

  <!-- Современный -->
  <text x="910" y="130" class="sans" font-size="11" fill="#8A7F82">ООО «Пример» · г. Москва, ул. Примерная, д. 1</text>
  <line x1="910" y1="144" x2="1190" y2="144" stroke="#E7DFD7" stroke-width="1.5"/>
  <g class="sans" fill="#2A2326">
    <text x="910" y="182" font-size="12">Генеральному директору</text>
    <text x="910" y="199" font-size="12">Иванову И. И.</text>
    <text x="910" y="248" font-size="18" font-weight="700">Служебная записка</text>
    <text x="910" y="272" font-size="11" fill="#8A7F82">12.09.2026</text>
    <text x="910" y="291" font-size="11" fill="#8A7F82">№</text>
    <text x="910" y="324" font-size="13" font-weight="600">О закупке ноутбука</text>
    <text x="910" y="540" font-size="12">Ведущий специалист</text>
    <text x="910" y="557" font-size="12">Петров П. П.</text>
    <text x="1190" y="620" font-size="10" fill="#8A7F82" text-anchor="end">Страница 1 из 1</text>
  </g>
  <rect x="926" y="279" width="46" height="17" rx="2" fill="#F4E3A8"/>
  <text x="949" y="291" text-anchor="middle" class="sans" font-size="10" fill="#8C5A11">[Номер]</text>
  <g fill="#E7DFD7">
    <rect x="910" y="348" width="270" height="6" rx="3"/>
    <rect x="910" y="364" width="248" height="6" rx="3"/>
    <rect x="910" y="380" width="262" height="6" rx="3"/>
    <rect x="910" y="396" width="190" height="6" rx="3"/>
    <rect x="910" y="422" width="266" height="6" rx="3"/>
    <rect x="910" y="438" width="240" height="6" rx="3"/>
    <rect x="910" y="454" width="258" height="6" rx="3"/>
    <rect x="910" y="470" width="120" height="6" rx="3"/>
  </g>
  <line x1="910" y1="602" x2="1190" y2="602" stroke="#E7DFD7" stroke-width="1.5"/>
  </g>
</svg>
